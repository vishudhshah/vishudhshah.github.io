<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - Vishudh Shah">
    <title>404 - Page Not Found | Vishudh Shah</title>

    <!-- favicon -->
    <link rel="shortcut icon" href="./assets/images/logo.ico" type="image/x-icon">

    <!-- custom css link -->
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/404.css">

    <!-- google font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <main class="error-main">
        <div class="error-container">
            
            <!-- 404 Content -->
            <div class="error-content">
                
                <!-- Animated 404 -->
                <div class="error-number">
                    <span class="digit">4</span>
                    <span class="digit-zero">
                        <span class="orbit"></span>
                        <span class="center-dot"></span>
                    </span>
                    <span class="digit">4</span>
                </div>

                <!-- Error Message -->
                <h1 class="error-title">Page Not Found</h1>
                <p class="error-description">
                    Oops! The page you're looking for seems to have wandered off into the data void.
                    It might have been moved, deleted, or never existed in the first place.
                </p>

                <!-- Action Buttons -->
                <div class="error-actions">
                    <a href="javascript:history.back()" class="btn btn-secondary">
                        <ion-icon name="arrow-back-outline"></ion-icon>
                        <span>Go Back</span>
                    </a>
                    <a href="/" class="btn btn-primary">
                        <ion-icon name="home-outline"></ion-icon>
                        <span>Go Home</span>
                    </a>
                </div>

                <!-- Quick Links -->
                <div class="quick-links">
                    <p class="quick-links-title">Or explore these pages:</p>
                    <ul class="links-list">
                        <li><a href="/#about">About Me</a></li>
                        <li><a href="/#resume">Resume</a></li>
                        <li><a href="/#projects">Projects</a></li>
                        <li><a href="/#contact">Contact</a></li>
                    </ul>
                </div>

            </div>

        </div>
    </main>

    <!-- ionicon link -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>

</html>
